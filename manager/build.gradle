plugins {
    id "magisk.android.application"
    id "magisk.app.signing"
    id "magisk.app.packaging"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "magisk.android.compose"
    id "dev.rikka.tools.refine"
}

def shizukuApplicationId = rootProject.ext["shizukuApplicationId"]
def shizukuVersionName = rootProject.ext["shizukuVersionName"]
def shizukuVersionCode = rootProject.ext["shizukuVersionCode"]

android {
    namespace = "moe.shizuku.manager"

    defaultConfig {
        applicationId = shizukuApplicationId
        versionCode = shizukuVersionCode
        versionName = shizukuVersionName
        externalNativeBuild {
            cmake {
                arguments = ["-DANDROID_STL=none"]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        prefab = true
        compose = true
    }
    externalNativeBuild {
        cmake {
            path = file("src/main/jni/CMakeLists.txt")
            version = libs.versions.cmake.get()
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ["**"]
        }
    }
    dependenciesInfo {
        includeInApk = false
    }
    // :shell:extractRishDex<Variant> drops the shell module's dex into a
    // variant-scoped directory here; the build type source set is what binds it
    // to the variant being assembled, so debug and release never see each
    // other's parts.
    sourceSets {
        debug { assets.srcDirs += ["build/generated/rishDex/debug"] }
        release { assets.srcDirs += ["build/generated/rishDex/release"] }
    }
    lint {
        checkReleaseBuilds = false
    }
}

// The Material 3 Expressive theme, its tonal palette and the locale-config used
// to be generated at build time by dev.rikka.tools.materialthemebuilder and
// dev.rikka.tools.autoresconfig. Both plugins look up com.android.build.gradle.AppExtension
// and the pre-AGP-9 variant API, so they cannot run on the AGP 9 toolchain this
// build is pinned to. Their output is deterministic for primaryColor #3F51B5, so
// it is committed instead: manager/src/main/res/values/generated_material_theme.xml,
// manager/src/main/res/values-v31/generated_material_theme.xml,
// manager/src/main/res/color/m3_*.xml and manager/src/main/res/xml/locales_config.xml.
// Re-run the two plugins on an AGP 8 build to regenerate them after a palette or
// locale change.

// assets/rish_shizuku*.dex is generated out of the shell module's APK, so the
// manager must not package before the matching shell variant has been
// extracted. APK naming/version injection comes from magisk.app.packaging.
tasks.configureEach {
    if (name == "preDebugBuild") {
        dependsOn(":shell:assembleDebug")
    }
    if (name == "preReleaseBuild") {
        dependsOn(":shell:assembleRelease")
    }
    // mergeAssets reads the directory the shell module writes the rish dex into,
    // so the dependency has to be explicit (Gradle 9 fails on the implicit one).
    if (name == "mergeDebugAssets") {
        dependsOn(":shell:extractRishDexDebug")
    }
    if (name == "mergeReleaseAssets") {
        dependsOn(":shell:extractRishDexRelease")
    }
}

configurations.configureEach {
    exclude group: "androidx.appcompat", module: "appcompat"
    exclude group: "androidx.profileinstaller", module: "profileinstaller"
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    implementation project(":server")
    implementation project(":rish")
    implementation project(":starter")
    implementation project(":api")
    implementation project(":provider")

    implementation libs.hidden.compat
    compileOnly libs.hidden.stub

    implementation libs.androidx.browser
    implementation libs.androidx.core.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.recyclerview
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.work.runtime.ktx

    implementation libs.apksig
    implementation libs.material
    implementation libs.okhttp
    implementation libs.libsu.core

    implementation libs.rikka.appcompat
    implementation libs.rikka.compatibility
    implementation libs.rikka.core.ktx
    implementation libs.rikka.material
    implementation libs.rikka.html.ktx
    implementation libs.rikka.recyclerview.adapter
    implementation libs.rikka.recyclerview.ktx
    implementation libs.rikka.insets
    implementation libs.rikka.layoutinflater
    implementation libs.rikka.lifecycle.resource.livedata

    implementation libs.arscblib
    implementation libs.boringssl
    implementation libs.bouncycastle.bcpkix
    implementation libs.kotlinx.serialization.json
    implementation libs.libcxx
    implementation libs.hiddenapibypass
    implementation libs.appiconloader

    // Compose: magisk.android.compose already pulls the BOM, ui, material3,
    // ui-tooling-preview, activity-compose and the lifecycle-compose trio.
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.material.icons.extended
    debugImplementation libs.androidx.compose.ui.tooling

    implementation project(":magisk-ui-kit")
}
