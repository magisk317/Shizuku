# Project-wide Gradle settings.
#
# The managed block below is kept byte-identical to the magisk3171 shared
# chain (magisk-build-logic) so every consumer builds with the same memory
# budget, warning mode and configuration-cache policy.
#
# Memory budget: CI job containers are capped at 8 GiB with 9 GiB swap, so the
# daemon heap plus metaspace must leave room for the Kotlin compile daemon and
# AGP workers.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED -Djava.awt.headless=true
# Parallel project execution multiplies peak memory across modules; keep it off
# so the daemon stays inside the container limit above.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.warning.mode=all
android.useAndroidX=true
kotlin.jvm.target.validation.mode=ERROR

# Shizuku reads theme attributes that the material libraries declare through the
# app's own R class (R.attr.colorOnSurfaceVariant in SettingsFragment), which
# needs transitive R classes. Kept outside the managed block so build-logic syncs
# cannot drop it.
android.nonTransitiveRClass=false
